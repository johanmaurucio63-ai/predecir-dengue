services:
  - type: web
    name: complicasense
    runtime: python
    buildCommand: pip install -r requirements.txt && jupyter nbconvert --to notebook --execute notebooks/01_exploracion_modelado_complicasense.ipynb --output executed_modelado.ipynb --output-dir artifacts
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    autoDeploy: true
